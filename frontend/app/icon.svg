<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Margin Putih Latar Belakang -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Kotak Biru Gelap (Dark Navy Background) -->
  <rect x="36" y="36" width="440" height="440" fill="#061d3d"/>

  <!-- Ikon Pin Peta Biru dengan lubang di tengah -->
  <path d="M 256 420 C 370 280 400 230 400 165 A 144 144 0 0 0 112 165 C 112 230 142 280 256 420 Z M 256 270 A 105 105 0 1 1 256 60 A 105 105 0 1 1 256 270 Z" fill="#0c3a66" fill-rule="evenodd"/>

  <!-- Siluet Geometris Tanjak Melayu Emas -->
  <g transform="translate(0, -45)">
    <!-- Grup lipatan Tanjak dengan garis pemisah presisi -->
    <g fill="#f1a100" stroke="#061d3d" stroke-width="4" stroke-linejoin="round">
      <!-- Dasar Kiri -->
      <polygon points="175,235 240,235 240,255 180,255" />
      
      <!-- Dasar Kanan -->
      <polygon points="272,235 335,235 330,255 272,255" />
      
      <!-- Ujung Tajam Kiri Luar -->
      <polygon points="175,235 170,185 195,215" />
      
      <!-- Lipatan Kiri Dalam -->
      <polygon points="190,235 210,165 240,225" />
      
      <!-- Layar/Lipatan Besar Kanan -->
      <polygon points="270,225 310,115 350,170 330,235" />
      
      <!-- Lipatan Tengah Kanan -->
      <polygon points="245,225 295,150 270,225" />
      
      <!-- Emblem/Perisai Utama Tengah -->
      <polygon points="236,220 276,220 282,240 256,260 230,240" />
    </g>
    
    <!-- Cutout (Lubang) Belah Ketupat Biru di Tengah Emblem -->
    <polygon points="256,230 266,240 256,252 246,240" fill="#061d3d" />
  </g>
</svg>
