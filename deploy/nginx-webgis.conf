# ============================================================
# nginx-webgis.conf — reverse proxy backend ke domain/subdomain
# Pasang:
#   cp deploy/nginx-webgis.conf /etc/nginx/sites-available/webgis-api
#   ln -s /etc/nginx/sites-available/webgis-api /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Referensi: gunakan IP/domain publik server Oracle kamu.
# ============================================================
server {
    listen 80;
    server_name api.webgis-kepri.my.id;   # GANTI: domain publik / IP server

    client_max_body_size 25m;             # ukuran upload foto

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
