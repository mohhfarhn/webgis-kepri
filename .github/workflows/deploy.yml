# ============================================================
# deploy.yml — Deploy otomatis backend ke Oracle Cloud VM via SSH
# Trigger: setiap push ke branch main (bukan PR).
#
# Prasyarat — set Repository Secrets (Settings > Secrets > Actions):
#   VPS_HOST      = IP publik / domain server Oracle
#   VPS_USER      = user yang bisa sudo (mis. ubuntu) ATAU webgis
#   VPS_SSH_KEY   = private key SSH (PEM), multi-line
#   VPS_PORT      = port SSH (default 22)
#
# Jalannya: SSH ke server -> cd /var/www/webgis/backend -> pull -> install
# -> prisma migrate deploy -> build -> restart systemd webgis-api.
# ============================================================
name: Deploy Backend ke Oracle

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    if: github.repository == 'mohhfarhn/webgis-kepri'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tulis private key ke file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy di server (sebagai root via sudo)
        run: |
          ssh -i ~/.ssh/id_rsa -p "${{ secrets.VPS_PORT || '22' }}" \
              -o StrictHostKeyChecking=no \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "sudo -i bash /var/www/webgis/deploy.sh main"

      - name: Cek health backend
        run: |
          sleep 3
          curl -sf --retry 5 --retry-delay 5 \
            "http://${{ secrets.VPS_HOST }}/api/health" && echo "OK: backend sehat" || echo "WARN: health belum merespon (periksa log)"
